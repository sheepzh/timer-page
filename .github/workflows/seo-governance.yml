name: SEO Governance Loop

on:
    schedule:
        - cron: '0 2 1,6,11,16,21,26 * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    observe:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            - name: Observe Search Console
              env:
                  GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
                  GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
                  GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
              run: node script/seo-observe.ts

            - name: Upload report
              uses: actions/upload-artifact@v4
              with:
                  name: seo-report
                  path: .seo-reports/*.md
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

    optimize:
        needs: observe
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
        env:
            COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        steps:
            - name: Download report
              uses: actions/download-artifact@v4
              with:
                  name: seo-report
                  path: .seo-reports/

            - name: Preflight report
              run: |
                  set -e
                  REPORT=$(ls -1 .seo-reports/*.md 2>/dev/null | sort | tail -1 || true)
                  if [ -z "$REPORT" ]; then
                      echo "No report in .seo-reports. Aborting before an issue is created."
                      exit 1
                  fi
                  grep -q '^# SEO observe ' "$REPORT" || { echo "$REPORT has no header line."; exit 1; }
                  grep -q 'Page dimension:' "$REPORT" || { echo "$REPORT has no page totals."; exit 1; }
                  grep -q '## Summary' "$REPORT" || { echo "$REPORT has no summary block."; exit 1; }
                  grep -q '## Baseline' "$REPORT" || { echo "$REPORT has no baseline block."; exit 1; }
                  grep -q '## Deploy window' "$REPORT" || { echo "$REPORT has no deploy-window block."; exit 1; }
                  grep -q '## Details (agent input)' "$REPORT" || { echo "$REPORT has no details boundary."; exit 1; }
                  BYTES=$(wc -c < "$REPORT")
                  if [ "$BYTES" -gt 60000 ]; then
                      echo "Report is ${BYTES} bytes, over the 60000 limit for an issue body."
                      exit 1
                  fi
                  if [ -z "$COPILOT_TOKEN" ]; then
                      echo "COPILOT_TOKEN is not set. Without it the issue cannot be assigned to an agent, so no issue is opened."
                      exit 1
                  fi
                  echo "Preflight ok: $REPORT"

            - name: Open governance issue for Copilot coding agent
              id: issue
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  set -e
                  REPORT=$(ls -1 .seo-reports/*.md | sort | tail -1)
                  {
                      echo "Automated SEO governance loop."
                      echo ""
                      echo "Read .github/skills/seo-governance/SKILL.md in full before any edit."
                      echo ""
                      awk '/^## Details \(agent input\)$/{exit} {print}' "$REPORT"
                      echo ""
                      echo "<details><summary>Full tables for attribution (agent input)</summary>"
                      echo ""
                      awk '/^## Details \(agent input\)$/{f=1;next} f' "$REPORT"
                      echo ""
                      echo "</details>"
                      echo ""
                      echo "Execute only the optimize phase: apply exactly the actions whose trigger"
                      echo "thresholds in SKILL.md section 2 are hit by the report. Respect the file"
                      echo "whitelist in section 3, the language rules and brand safety red lines in"
                      echo "section 4, and the fact-verification rules in section 5."
                      echo ""
                      echo "Carry every lead from the report into the pull request body under a Leads"
                      echo "heading, unchanged, even when no threshold is hit."
                      echo ""
                      echo "Open a pull request whose title starts with [seo-governance] and whose body"
                      echo "lists each applied action with the threshold that triggered it. Do not"
                      echo "modify any path outside the whitelist. If no threshold is hit, close this"
                      echo "issue without opening a pull request."
                  } > .issue-body.md
                  URL=$(gh issue create \
                      --title "[seo-governance] optimize $(date -u +%F)" \
                      --body-file .issue-body.md)
                  echo "url=$URL" >> "$GITHUB_OUTPUT"
                  echo "Opened $URL"

            - name: Assign Copilot
              env:
                  GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  URL: ${{ steps.issue.outputs.url }}
              run: |
                  set -e
                  OWNER=${GH_REPO%/*}
                  NAME=${GH_REPO#*/}
                  NUMBER=$(basename "$URL")
                  ISSUE_ID=$(gh api graphql \
                      -f query="query{repository(owner:\"$OWNER\",name:\"$NAME\"){issue(number:$NUMBER){id}}}" \
                      --jq .data.repository.issue.id)
                  BOT_ID=$(gh api graphql \
                      -f query="query{repository(owner:\"$OWNER\",name:\"$NAME\"){suggestedActors(capabilities:[CAN_BE_ASSIGNED],first:50){nodes{login ... on Bot{id}}}}}" \
                      --jq '.data.repository.suggestedActors.nodes[] | select(.login=="copilot-swe-agent") | .id')
                  gh api graphql \
                      -f query="mutation{replaceActorsForAssignable(input:{assignableId:\"$ISSUE_ID\",actorIds:[\"$BOT_ID\"]}){assignable{... on Issue{number}}}}"
                  echo "Assigned copilot-swe-agent to issue $NUMBER"
